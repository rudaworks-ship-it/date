
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영수증 배정 일정 생성기</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background: #f4f6f9;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border-radius: 20px;
            padding: 32px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06),
                0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h2 {
            margin: 0 0 28px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .input-group input[type="date"],
        .input-group input[type="number"],
        .input-group input[type="text"] {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .days-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .day-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: white;
            border: 1px solid #dbe1ea;
            border-radius: 10px;
            padding: 10px 0;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .day-label:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .hint {
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #6b7280;
        }

        button {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {

            .container {
                padding: 24px 18px;
            }

            h2 {
                font-size: 24px;
            }

            .days-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>영수증 배정 일정 생성기</h2>

    <div class="input-group">
        <label for="startDate">시작 날짜</label>
        <input type="date" id="startDate" value="2026-05-29">
    </div>

    <div class="input-group">
        <label for="totalCount">총 건수</label>
        <input type="number" id="totalCount" value="100">
    </div>

    <div class="input-group">
        <label for="dailyCount">하루 배정 건수</label>
        <input type="number" id="dailyCount" value="4">
    </div>

    <div class="card">

        <label class="toggle-label">
            <input type="checkbox" id="excludeWeekends" checked>
            주말 제외 (토 · 일)
        </label>

        <div class="input-group" style="margin-bottom:0;">
            <label for="customHolidays" style="font-size:13px;">
                추가 제외 날짜
            </label>

            <input
                type="text"
                id="customHolidays"
                placeholder="예: 2026-10-05, 2026-10-06"
            >

            <div class="hint">
                공휴일이나 휴무일 등 제외할 날짜를 쉼표(,)로 구분해서 입력하세요.
            </div>
        </div>

    </div>

    <div class="card">

        <label style="font-weight:600; font-size:15px;">
            작업 요일 선택
        </label>

        <div class="days-container">

            <label class="day-label">
                <input type="checkbox" class="work-day" value="1">
                월
            </label>

            <label class="day-label">
                <input type="checkbox" class="work-day" value="2">
                화
            </label>

            <label class="day-label">
                <input type="checkbox" class="work-day" value="3">
                수
            </label>

            <label class="day-label">
                <input type="checkbox" class="work-day" value="4">
                목
            </label>

            <label class="day-label">
                <input type="checkbox" class="work-day" value="5">
                금
            </label>

            <label class="day-label">
                <input type="checkbox" class="work-day" value="6">
                토
            </label>

            <label class="day-label">
                <input type="checkbox" class="work-day" value="0">
                일
            </label>

        </div>

        <div class="hint">
            원하는 요일만 체크하면 해당 요일에만 자동 배정됩니다.
        </div>

    </div>

    <button onclick="generateExcel()">
        엑셀 다운로드
    </button>

</div>

<script>

function generateExcel() {

    const startDateVal =
        document.getElementById('startDate').value;

    const totalCount =
        parseInt(document.getElementById('totalCount').value);

    const dailyCount =
        parseInt(document.getElementById('dailyCount').value);

    const excludeWeekends =
        document.getElementById('excludeWeekends').checked;

    const customHolidaysInput =
        document.getElementById('customHolidays').value;

    const customHolidays = customHolidaysInput
        .split(',')
        .map(d => d.trim())
        .filter(d => d !== "");

    const selectedDays =
        Array.from(document.querySelectorAll('.work-day:checked'))
        .map(el => parseInt(el.value));

    if (!startDateVal ||
        isNaN(totalCount) ||
        isNaN(dailyCount)) {

        alert("모든 값을 올바르게 입력해주세요.");
        return;
    }

    if (selectedDays.length === 0) {

        alert("최소 하나 이상의 작업 요일을 선택해야 합니다.");
        return;
    }

    const data = [];

    let currentDate = new Date(startDateVal);

    let assignedCount = 0;

    let currentDayCases = 0;

    while (assignedCount < totalCount) {

        const yyyy = currentDate.getFullYear();

        const mm =
            String(currentDate.getMonth() + 1)
            .padStart(2, '0');

        const dd =
            String(currentDate.getDate())
            .padStart(2, '0');

        const dateStr = `${yyyy}-${mm}-${dd}`;

        const dayOfWeek = currentDate.getDay();

        let isSkip = false;

        // 주말 제외
        if (
            excludeWeekends &&
            (dayOfWeek === 0 || dayOfWeek === 6)
        ) {
            isSkip = true;
        }

        // 추가 제외 날짜
        if (
            !isSkip &&
            customHolidays.includes(dateStr)
        ) {
            isSkip = true;
        }

        // 선택 요일 제외
        if (
            !isSkip &&
            !selectedDays.includes(dayOfWeek)
        ) {
            isSkip = true;
        }

        // 배정
        if (!isSkip) {

            data.push({
                receipt_date: dateStr,
                review_content: ""
            });

            assignedCount++;

            currentDayCases++;

            if (currentDayCases >= dailyCount) {

                currentDate.setDate(
                    currentDate.getDate() + 1
                );

                currentDayCases = 0;
            }

        } else {

            currentDate.setDate(
                currentDate.getDate() + 1
            );

            currentDayCases = 0;
        }
    }

    // 엑셀 생성
    const worksheet =
        XLSX.utils.json_to_sheet(data);

    // 컬럼 넓이
    worksheet['!cols'] = [
        { wch: 18 },
        { wch: 60 }
    ];

    const workbook =
        XLSX.utils.book_new();

    // 시트 이름
    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "영수증날짜"
    );

    // 파일명
    const filename = "영수증날짜.xlsx";

    XLSX.writeFile(workbook, filename);
}

</script>

</body>
</html>
